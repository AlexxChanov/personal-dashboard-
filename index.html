<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PERSONAL SPACE</title><style>body{margin:0;background:#090b10;color:#f6f1e9;font:18px Arial,sans-serif;padding:5vw}main{max-width:1100px;margin:auto}h1{color:#e2bd83}section{background:#181d26;border:1px solid #303642;border-radius:22px;padding:28px;margin:18px 0}input,button{font:inherit;padding:14px;border-radius:9px;border:1px solid #626976;background:#252c37;color:white;max-width:100%}button{background:#d5ae72;color:#111;cursor:pointer;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}.grid section{margin:0}.big{font-size:48px;margin:12px 0}.bar{height:11px;background:#414650;border-radius:20px;overflow:hidden}.fill{height:100%;background:#d5ae72}.muted{color:#a8adba}label{display:inline-block;margin:10px}label input{display:block;width:160px}#message{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><main><h1>PERSONAL SPACE</h1><section id="login"><h2>Вход в дашборд</h2><p class="muted">Введи email и получи ссылку для входа.</p><input id="email" type="email" placeholder="Email"><button id="send">Получить ссылку</button><p id="message" class="muted">Готов к подключению</p></section><div id="dashboard" hidden><section><div class="muted">МОЙ ДЕНЬ</div><div class="big" id="clock">--:--</div><div id="date"></div></section><div class="grid"><section><h3>Вес</h3><div class="big"><span id="weight">109</span> кг</div><div class="bar"><div id="weightbar" class="fill"></div></div><p id="weightnote"></p></section><section><h3>Собеседование</h3><div class="big"><span id="prep">35</span>%</div><div class="bar"><div id="prepbar" class="fill"></div></div><p id="interviewnote"></p></section><section><h3>Калории сегодня</h3><div class="big" id="calories">200</div><div class="bar"><div id="calbar" class="fill"></div></div><p id="calnote"></p></section><section><h3>Погода в Дубае</h3><div class="big" id="weather">--°</div><p class="muted" id="weatherinfo">Загрузка</p></section></div><section><h3>Задачи</h3><div id="tasks">Нет задач</div></section><section><h3>Изменить показатели</h3><label>Вес<input type="number" step=".1" id="ew"></label><label>Подготовка, %<input type="number" min="0" max="100" id="ep"></label><label>Калории<input type="number" min="0" id="ec"></label><button id="save">Сохранить</button><p id="saveinfo"></p><button id="logout">Выйти</button></section></div></main><script>
(function(){'use strict';var BASE='https://styqxykhyiyavgbkkglo.supabase.co',KEY='sb_publishable_AWCZHfy-XeB3E4w6-f6g-Q_akE5XHlW';var $=function(id){return document.getElementById(id)},token='',refresh='',uid='',row=null;function status(s){$('message').textContent=s}function localDay(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Dubai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}function headers(auth){var h={'apikey':KEY,'Content-Type':'application/json'};if(auth)h.Authorization='Bearer '+token;return h}async function request(path,method,body,auth){var response=await fetch(BASE+path,{method:method||'GET',headers:headers(auth),body:body?JSON.stringify(body):undefined});var txt=await response.text(),data;try{data=JSON.parse(txt)}catch(e){data={message:txt.slice(0,300)}}if(!response.ok)throw Error(data.msg||data.error_description||data.message||data.error||('HTTP '+response.status));return data}function saveTokens(data){token=data.access_token;refresh=data.refresh_token||refresh;localStorage.setItem('tv_session',JSON.stringify({token:token,refresh:refresh}))}async function restore(){var fragment=new URLSearchParams(location.hash.replace(/^#/,''));if(fragment.get('error')){status('Ошибка ссылки: '+(fragment.get('error_description')||fragment.get('error')));return}if(fragment.get('access_token')){saveTokens({access_token:fragment.get('access_token'),refresh_token:fragment.get('refresh_token')});history.replaceState(null,'',location.pathname)}else{var saved=localStorage.getItem('tv_session');if(saved){try{var t=JSON.parse(saved);token=t.token;refresh=t.refresh}catch(e){}}}if(!token)return;try{var u=await request('/auth/v1/user','GET',null,true);uid=u.id;await load();$('login').hidden=true;$('dashboard').hidden=false}catch(e){if(refresh){try{var d=await request('/auth/v1/token?grant_type=refresh_token','POST',{refresh_token:refresh},false);saveTokens(d);var u2=await request('/auth/v1/user','GET',null,true);uid=u2.id;await load();$('login').hidden=true;$('dashboard').hidden=false;return}catch(x){status('Не удалось восстановить вход: '+x.message)}}else status('Ошибка входа: '+e.message)}}$('send').onclick=async function(){var email=$('email').value.trim();if(!email){status('Сначала введи email');return}status('Отправляем запрос…');try{await request('/auth/v1/otp','POST',{email:email,create_user:true,gotrue:true,email_redirect_to:location.origin+location.pathname},false);status('Запрос принят. Проверь почту, включая папку Спам.')}catch(e){status('Ошибка Supabase: '+e.message)}};async function load(){if(!uid)return;var data=await request('/rest/v1/tv_personal_dashboard?user_id=eq.'+encodeURIComponent(uid)+'&select=*','GET',null,true);if(!data.length){data=await request('/rest/v1/tv_personal_dashboard','POST',{user_id:uid,starting_weight:109,current_weight:109,target_weight:99,interview_date:'2027-01-15',preparation_percent:35,calories_eaten:200,calories_target:1800,calorie_date:localDay()},true);data=await request('/rest/v1/tv_personal_dashboard?user_id=eq.'+encodeURIComponent(uid)+'&select=*','GET',null,true)}row=data[0];render();try{var tasks=await request('/rest/v1/tv_personal_tasks?user_id=eq.'+encodeURIComponent(uid)+'&select=title,is_done&order=created_at.desc&limit=10','GET',null,true);$('tasks').textContent=tasks.length?tasks.map(function(t){return(t.is_done?'✓ ':'○ ')+t.title}).join(' · '):'Нет задач'}catch(e){$('tasks').textContent='Ошибка задач: '+e.message}}function render(){var d=row,weight=Number(d.current_weight),goal=Number(d.target_weight),start=Number(d.starting_weight),pct=start===goal?0:Math.max(0,Math.min(100,(start-weight)/(start-goal)*100));$('weight').textContent=weight;$('weightbar').style.width=pct+'%';$('weightnote').textContent=Math.round(pct)+'% к цели '+goal+' кг';$('prep').textContent=d.preparation_percent;$('prepbar').style.width=d.preparation_percent+'%';var days=Math.max(0,Math.ceil((new Date(d.interview_date+'T12:00:00Z')-new Date(localDay()+'T12:00:00Z'))/86400000));$('interviewnote').textContent='До собеседования: '+days+' дней';var eaten=d.calorie_date===localDay()?d.calories_eaten:0;$('calories').textContent=eaten;$('calbar').style.width=Math.min(100,100*eaten/d.calories_target)+'%';$('calnote').textContent='Осталось по плану: '+Math.max(0,d.calories_target-eaten)+' ккал';$('ew').value=weight;$('ep').value=d.preparation_percent;$('ec').value=eaten} $('save').onclick=async function(){var patch={current_weight:Number($('ew').value),preparation_percent:Number($('ep').value),calories_eaten:Number($('ec').value),calorie_date:localDay(),updated_at:new Date().toISOString()};if(patch.current_weight<=0||patch.preparation_percent<0||patch.preparation_percent>100||patch.calories_eaten<0){$('saveinfo').textContent='Проверь числа';return}try{await request('/rest/v1/tv_personal_dashboard?user_id=eq.'+encodeURIComponent(uid),'PATCH',patch,true);$('saveinfo').textContent='Сохранено';await load()}catch(e){$('saveinfo').textContent=e.message}};$('logout').onclick=function(){localStorage.removeItem('tv_session');location.reload()};function tick(){var n=new Date();$('clock').textContent=n.toLocaleTimeString('ru-RU',{timeZone:'Asia/Dubai',hour:'2-digit',minute:'2-digit'});$('date').textContent=n.toLocaleDateString('ru-RU',{timeZone:'Asia/Dubai',weekday:'long',day:'numeric',month:'long',year:'numeric'})}tick();setInterval(tick,1000);async function weather(){try{var d=await(await fetch('https://api.open-meteo.com/v1/forecast?latitude=25.2048&longitude=55.2708&current=temperature_2m')).json();$('weather').textContent=Math.round(d.current.temperature_2m)+'°';$('weatherinfo').textContent='Текущая температура'}catch(e){$('weatherinfo').textContent='Погода недоступна'}}weather();setInterval(weather,900000);setInterval(function(){load().catch(function(e){$('saveinfo').textContent='Ошибка синхронизации: '+e.message})},20000);restore().catch(function(e){status('Ошибка запуска: '+e.message)});
})();</script></body></html>
